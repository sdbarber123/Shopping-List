<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steve &amp; Anita's List</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f6fa;
      color: #1a1a2e;
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto; 
      padding: 0 0 90px;
    }

    /* ── Title ── */
    .title-area {
      padding: 40px 24px 28px;
      background: linear-gradient(160deg, #6366f1 0%, #818cf8 100%);
      color: #fff;
    }
    @keyframes cart-slide {
      from { transform: translateX(0); }
      to   { transform: translateX(400px); }
    }
    .title-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: #c7d2fe;
      margin-bottom: 10px;
    }
    .title-badge svg {
      animation: cart-slide 7s linear infinite;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.3px;
      color: #fff;
    }
    .title-sub {
      margin-top: 6px;
      font-size: 13px;
      color: #c7d2fe;
    }

    /* ── Add row ── */
    .add-wrap {
      margin: 20px 16px 0;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 16px rgba(99,102,241,.10), 0 1px 4px rgba(0,0,0,.06);
      padding: 4px 4px 4px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .add-wrap input[type=text] {
      flex: 1;
      font-family: inherit;
      font-size: 15px;
      color: #1a1a2e;
      background: transparent;
      border: none;
      outline: none;
      padding: 10px 0;
    }
    .add-wrap input[type=text]::placeholder { color: #c0c4d6; }

    .btn-add {
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      border: none;
      border-radius: 10px;
      padding: 9px 18px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity .15s, transform .1s;
      box-shadow: 0 2px 8px rgba(99,102,241,.35);
    }
    .btn-add:hover  { opacity: .9; }
    .btn-add:active { transform: scale(.96); }

    /* ── Chips ── */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 14px 16px 0;
    }

    .chip {
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 13px;
      border: 1.5px solid #e2e5f0;
      border-radius: 999px;
      background: #fff;
      color: #7c82a0;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .chip:hover { background: #eef2ff; color: #6366f1; border-color: #a5b4fc; }

    /* ── List card ── */
    .list-card {
      margin: 16px 16px 0;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 16px rgba(99,102,241,.07), 0 1px 4px rgba(0,0,0,.04);
      overflow: hidden;
    }

    ul#list { list-style: none; }

    ul#list li {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-bottom: 1px solid #f0f1f7;
      transition: background .15s;
      animation: fadeIn .18s ease;
    }
    ul#list li:last-child { border-bottom: none; }
    ul#list li:hover { background: #fafbff; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Checkbox */
    .cb-wrap {
      position: relative;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }
    .cb-wrap input[type=checkbox] {
      position: absolute;
      opacity: 0;
      inset: 0;
      cursor: pointer;
      z-index: 2;
      margin: 0;
    }
    .cb-box {
      position: absolute;
      inset: 0;
      border: 2px solid #d1d5e8;
      border-radius: 6px;
      background: #fff;
      transition: background .18s, border-color .18s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cb-wrap input[type=checkbox]:checked ~ .cb-box {
      background: linear-gradient(135deg, #6366f1, #818cf8);
      border-color: transparent;
      box-shadow: 0 2px 6px rgba(99,102,241,.4);
    }
    .cb-box::after {
      content: '';
      width: 5px;
      height: 9px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translateY(-1px);
      opacity: 0;
      transition: opacity .13s;
    }
    .cb-wrap input[type=checkbox]:checked ~ .cb-box::after { opacity: 1; }

    /* Item text */
    .item-text {
      flex: 1;
      font-size: 15px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color .2s;
    }
    .item-text.done {
      text-decoration: line-through;
      color: #b0b5cc;
      font-weight: 400;
    }

    /* Delete button */
    .btn-del {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      line-height: 1;
      color: transparent;
      background: transparent;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    ul#list li:hover .btn-del { color: #d1d5e8; }
    .btn-del:hover { background: #fff0f0; color: #ef4444 !important; }

    /* Empty state */
    .empty-state {
      padding: 48px 24px;
      text-align: center;
    }
    .empty-icon { font-size: 80px; margin-bottom: 10px; }
    .empty-state p { font-size: 14px; color: #9ca3b8; }

    /* ── Footer ── */
    .footer {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 18px;
      background: rgba(245,246,250,.92);
      backdrop-filter: blur(10px);
      border-top: 1px solid #e8eaf2;
      font-size: 12px;
      color: #9ca3b8;
    }

    .status-row { display: flex; align-items: center; gap: 6px; }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #ccc;
      transition: background .3s;
    }
    .status-dot.live       { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.2); }
    .status-dot.error      { background: #ef4444; }
    .status-dot.connecting { background: #f59e0b; animation: blink 1.1s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

    .btn-clear {
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: #9ca3b8;
      background: transparent;
      border: 1.5px solid #e2e5f0;
      border-radius: 7px;
      padding: 5px 12px;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .btn-clear:hover { background: #fff0f0; color: #ef4444; border-color: #fca5a5; }

    #errmsg {
      font-size: 13px;
      margin: 8px 16px 0;
      padding: 9px 14px;
      background: #fff0f0;
      color: #ef4444;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="title-area">
    <div class="title-badge">
      <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Shared List
    </div>
    <h1>Steve &amp; Anita's<br>Shopping List</h1>
    <p class="title-sub">Changes sync instantly for both of you</p>
  </div>

  <div class="add-wrap">
    <input id="item" type="text" placeholder="Add an item…" autocomplete="off" />
    <button id="add" class="btn-add">Add +</button>
  </div>

  <div class="chips" id="quick"></div>

  <div id="errmsg"></div>

  <div class="list-card">
    <ul id="list"></ul>
  </div>

  <div class="footer">
    <div class="status-row">
      <div class="status-dot connecting" id="statusDot"></div>
      <span id="statusText">Connecting…</span>
    </div>
    <button id="clear" class="btn-clear">Clear checked</button>
  </div>

  <!-- Firebase 9 compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey:            "AIzaSyAR2LNDnwiT1ICRv2M5QacptkaSaVtNh94",
      authDomain:        "shopping-list-6af57.firebaseapp.com",
      projectId:         "shopping-list-6af57",
      storageBucket:     "shopping-list-6af57.firebasestorage.app",
      messagingSenderId: "943863653178",
      appId:             "1:943863653178:web:1d6a3a0140f8fb4178a603"
    };

    firebase.initializeApp(firebaseConfig);
    const db       = firebase.firestore();
    const LIST_REF = db.collection('shopping').doc('items');

    const dotEl    = document.getElementById('statusDot');
    const textEl   = document.getElementById('statusText');
    const listEl   = document.getElementById('list');
    const itemEl   = document.getElementById('item');
    const addBtn   = document.getElementById('add');
    const quickEl  = document.getElementById('quick');
    const clearBtn = document.getElementById('clear');
    const errEl    = document.getElementById('errmsg');

    function setStatus(state, label) {
      dotEl.className    = 'status-dot ' + state;
      textEl.textContent = label;
    }

    function showErr(msg) {
      errEl.textContent   = msg;
      errEl.style.display = 'block';
      setTimeout(() => errEl.style.display = 'none', 5000);
    }

    const COMMON = ["Coffee","Cereal","Fruit","Eggs","Milk","Half-n-half","Juice","Yogurt","Sparkling Water"];
    COMMON.forEach(name => {
      const b = document.createElement('button');
      b.className   = 'chip';
      b.textContent = '+ ' + name;
      b.onclick     = () => addItem(name);
      quickEl.appendChild(b);
    });

    async function loadItems() {
      const snap = await LIST_REF.get();
      return snap.exists ? (snap.data().items || []) : [];
    }

    async function saveItems(items) {
      await LIST_REF.set({ items });
    }

    async function addItem(text) {
      text = (text || '').trim();
      if (!text) return;
      try {
        let items = await loadItems();
        const norm = text.toLowerCase().replace(/\s+/g, ' ').trim();
        const idx  = items.findIndex(it =>
          (it.text || '').toLowerCase().replace(/\s+/g, ' ').trim() === norm
        );
        if (idx >= 0) {
          const existing = items.splice(idx, 1)[0];
          existing.text = text; existing.checked = false;
          existing.checkedAt = null; existing.updatedAt = Date.now();
          items.unshift(existing);
        } else {
          const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
          items.unshift({ id, text, checked: false, createdAt: Date.now() });
        }
        while (items.length > 300) items.pop();
        await saveItems(items);
      } catch(e) {
        showErr('Error adding item: ' + e.message);
        console.error(e);
      }
    }

    async function toggleItem(id, checked) {
      try {
        const items = await loadItems();
        const idx = items.findIndex(it => it.id === id);
        if (idx >= 0) { items[idx].checked = checked; items[idx].checkedAt = checked ? Date.now() : null; }
        await saveItems(items);
      } catch(e) { showErr('Error updating item: ' + e.message); console.error(e); }
    }

    async function removeItem(id) {
      try {
        const items = (await loadItems()).filter(it => it.id !== id);
        await saveItems(items);
      } catch(e) { showErr('Error removing item: ' + e.message); console.error(e); }
    }

    async function clearChecked() {
      try {
        const items = (await loadItems()).filter(it => !it.checked);
        await saveItems(items);
      } catch(e) { showErr('Error clearing items: ' + e.message); console.error(e); }
    }

    function render(items) {
      listEl.innerHTML = '';
      const sorted = [...items].sort((a, b) => a.checked === b.checked ? 0 : (a.checked ? 1 : -1));

      if (!sorted.length) {
        const li = document.createElement('li');
        li.innerHTML = `<div class="empty-state"><div class="empty-icon">🛍️</div><p>Nothing here yet —<br>add the first item above.</p></div>`;
        listEl.appendChild(li);
        return;
      }

      for (const it of sorted) {
        const li = document.createElement('li');
        if (it.checked) li.classList.add('is-checked');

        const cbWrap = document.createElement('label');
        cbWrap.className = 'cb-wrap';
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = !!it.checked;
        cb.onchange = () => toggleItem(it.id, cb.checked);
        const cbBox = document.createElement('span');
        cbBox.className = 'cb-box';
        cbWrap.append(cb, cbBox);

        const text = document.createElement('span');
        text.className = 'item-text' + (it.checked ? ' done' : '');
        text.textContent = it.text;
        text.title = it.text;

        const del = document.createElement('button');
        del.className = 'btn-del';
        del.title     = 'Remove';
        del.innerHTML = '&times;';
        del.onclick   = () => removeItem(it.id);

        li.append(cbWrap, text, del);
        listEl.appendChild(li);
      }
    }

    addBtn.onclick = async () => {
      const text = itemEl.value.trim();
      if (!text) return;
      itemEl.value = '';
      itemEl.focus();
      await addItem(text);
    };

    itemEl.addEventListener('keydown', e => { if (e.key === 'Enter') addBtn.click(); });
    clearBtn.onclick = clearChecked;

    LIST_REF.onSnapshot(
      snap => {
        setStatus('live', 'Live');
        render(snap.exists ? (snap.data().items || []) : []);
      },
      err => {
        setStatus('error', 'Connection error');
        showErr('Connection error: ' + err.message);
        console.error(err);
      }
    );
  </script>
</body>
</html>
